name: Gerar planilhas de teste

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'
  push:
    paths:
      - "src/gerar_planilha.py"
      - "requirements.txt"
      - ".github/workflows/gerar-planilhas.yml"

jobs:
  gerar-planilhas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python src/gerar_planilha.py --mes 6 --ano 2026 --destino data/raw
      - uses: actions/upload-artifact@v4
        with:
          name: planilhas-de-teste
          path: data/raw/*.xlsx
